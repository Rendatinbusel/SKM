<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Survei Kepuasan Masyarakat</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #b91c1c; /* Merah KPU */
      --secondary: #ea580c; /* Oranye */
      --bg-gradient: linear-gradient(135deg, #b91c1c 0%, #ea580c 100%);
      --input-bg: #f8fafc;
      --input-border: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    body { 
      font-family: 'Poppins', sans-serif; 
      background: var(--bg-gradient); 
      margin: 0; 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
      box-sizing: border-box;
      overflow-x: hidden;
    }
    
    /* Dekorasi Background (Blob) */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      z-index: 0;
      opacity: 0.4;
      animation: float 8s ease-in-out infinite;
    }
    .blob-1 { top: -10%; left: -5%; width: 400px; height: 400px; background: #fca5a5; }
    .blob-2 { bottom: -10%; right: -5%; width: 500px; height: 500px; background: #fdba74; animation-delay: 2s; }
    .blob-3 { top: 40%; left: 60%; width: 300px; height: 300px; background: #fff; opacity: 0.2; animation-delay: 4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    .card { 
      background: #ffffff; 
      padding: 40px 30px; 
      border-radius: 28px; 
      width: 100%; 
      max-width: 430px; 
      max-height: 95vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35); 
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
      position: relative; 
      z-index: 10; 
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,0.5);
    }
    
    .card::-webkit-scrollbar { width: 6px; }
    .card::-webkit-scrollbar-track { background: transparent; }
    .card::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    
    @keyframes slideUp { 
      from { opacity: 0; transform: translateY(40px) scale(0.95); } 
      to { opacity: 1; transform: translateY(0) scale(1); } 
    }
    
    .header-icon { 
      text-align: center; 
      margin-bottom: 20px; 
      background: #ffffff; 
      width: 90px; 
      height: 90px; 
      border-radius: 24px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      margin-left: auto; 
      margin-right: auto; 
      box-shadow: 0 10px 25px rgba(185, 28, 28, 0.25), 0 0 0 8px rgba(255, 255, 255, 0.4);
      transition: transform 0.3s ease;
      color: var(--primary);
    }
    .header-icon:hover { transform: rotate(-5deg) scale(1.05); }
    
    h3 { 
      text-align: center; 
      color: var(--primary); 
      font-weight: 800; 
      margin-top: 0; 
      margin-bottom: 5px; 
      font-size: 22px; 
      letter-spacing: -0.5px;
    }
    
    .subtitle { 
      text-align: center; 
      color: var(--text-muted); 
      font-size: 12px; 
      font-weight: 500;
      margin-bottom: 30px; 
      display: block;
      text-wrap: balance; 
      line-height: 1.5;
      padding-bottom: 20px;
      border-bottom: 1px dashed #e2e8f0;
    }

    .page-indicator {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 20px;
      display: inline-block;
      background-color: #fef2f2;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #fca5a5;
    }

    .form-page { display: none; animation: fadeIn 0.4s ease; }
    .form-page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .input-group { margin-bottom: 18px; position: relative; }
    label { 
      display: block; 
      font-size: 13px; 
      font-weight: 600; 
      color: var(--text-main); 
      margin-bottom: 8px; 
      margin-left: 5px; 
    }
    
    .input-wrapper { position: relative; }
    .input-icon { 
      position: absolute; 
      left: 16px; 
      top: 50%; 
      transform: translateY(-50%); 
      color: #94a3b8; 
      pointer-events: none; 
      transition: color 0.3s ease;
    }
    
    input[type="text"], input[type="number"], select { 
      width: 100%; 
      padding: 15px 40px 15px 45px; 
      border: 1.5px solid var(--input-border); 
      border-radius: 14px; 
      font-size: 14px; 
      font-family: 'Poppins', sans-serif; 
      font-weight: 500;
      box-sizing: border-box; 
      background-color: var(--input-bg);
      transition: all 0.3s ease;
      color: var(--text-main);
      text-overflow: ellipsis; 
      white-space: nowrap;     
      overflow: hidden; 
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    .dropdown-arrow {
      position: absolute; 
      right: 18px; 
      top: 50%; 
      transform: translateY(-50%); 
      pointer-events: none; 
      color: #94a3b8;
    }
    
    input:focus, select:focus { 
      border-color: var(--primary); 
      outline: none; 
      background-color: #fff; 
      box-shadow: 0 0 0 4px rgba(185, 28, 28, 0.1); 
    }
    input:focus ~ .input-icon, select:focus ~ .input-icon { color: var(--primary); }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    /* Penyesuaian agar radio button muat dalam ukuran 430px */
    .radio-group-horizontal { display: flex; gap: 10px; flex-wrap: wrap; }
    .radio-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border: 1.5px solid var(--input-border);
      border-radius: 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      background: var(--input-bg);
      transition: all 0.3s ease;
      flex: 1 1 calc(50% - 10px);
      box-sizing: border-box;
    }
    .radio-option:hover { border-color: var(--secondary); background: #fff; }
    .radio-option input[type="radio"] { accent-color: var(--primary); transform: scale(1.1); margin: 0; }

    .question-card {
      background-color: #ffffff;
      border: 1.5px solid var(--input-border);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: border-color 0.3s ease;
    }
    .question-card:hover { border-color: #cbd5e1; }
    .question-title { font-weight: 600; font-size: 13px; margin-bottom: 12px; color: var(--text-main); line-height: 1.5; }

    .btn-group { display: flex; justify-content: space-between; margin-top: 15px; gap: 10px; }
    
    button { 
      width: 100%;
      padding: 16px; 
      border: none; 
      border-radius: 14px; 
      font-size: 16px; 
      font-weight: 700; 
      font-family: 'Poppins', sans-serif; 
      cursor: pointer; 
      transition: all 0.3s ease; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px;
      flex: 1;
      letter-spacing: 0.5px;
    }
    .btn-primary { 
      background: var(--bg-gradient); 
      color: white; 
      box-shadow: 0 10px 20px -5px rgba(185, 28, 28, 0.5);
    }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 25px -5px rgba(185, 28, 28, 0.6); }
    .btn-primary:active { transform: translateY(-1px); }
    
    .btn-secondary { 
      background: #f1f5f9; 
      color: var(--text-muted); 
      border: 1.5px solid #cbd5e1;
    }
    .btn-secondary:hover { background: #e2e8f0; color: var(--text-main); transform: translateY(-2px); }
    
    button:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; box-shadow: none; }
    .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); z-index: 9999;
      justify-content: center; align-items: center; animation: fadeBg 0.3s ease;
    }
    .modal-overlay.active { display: flex; }
    @keyframes fadeBg { from { opacity: 0; } to { opacity: 1; } }

    .modal-box {
      background: #fff; padding: 35px 30px; border-radius: 24px; width: 90%; max-width: 360px;
      text-align: center; animation: scaleUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    @keyframes scaleUp { from { transform: scale(0.8) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
    
    .modal-icon { 
      width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 20px; 
      display: flex; align-items: center; justify-content: center; 
      animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }
    @keyframes popIn { 0% { transform: scale(0); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
    
    .modal-icon.success { background: #d1fae5; color: #059669; box-shadow: 0 0 0 8px rgba(5, 150, 105, 0.1); }
    .modal-icon.error { background: #fee2e2; color: #dc2626; box-shadow: 0 0 0 8px rgba(220, 38, 38, 0.1); }
    
    .modal-box h3 { margin: 0 0 10px; color: var(--text-main); font-size: 22px; font-weight: 700; }
    .modal-box p { margin: 0 0 25px; color: var(--text-muted); font-size: 14px; line-height: 1.6; }
    
    .modal-btn { 
      background: var(--bg-gradient); color: #fff; border: none; padding: 14px 30px; 
      border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; width: 100%; 
      transition: 0.3s; box-shadow: 0 5px 15px rgba(185, 28, 28, 0.3);
    }
    .modal-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(185, 28, 28, 0.4); }

    @media (max-width: 480px) {
      .card { padding: 30px 20px; }
      h3 { font-size: 20px; }
      input[type="text"], input[type="number"], select { font-size: 13px; padding: 13px 35px 13px 42px; }
      .radio-option { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <!-- Dekorasi Background -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="card">
    <div class="header-icon">
      <svg width="45" height="45" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
    </div>
    <h3>Survei Kepuasan</h3>
    <span class="subtitle">Mohon isi formulir di bawah ini untuk membantu kami meningkatkan kualitas pelayanan.</span>

    <form id="formSurvey" onsubmit="kirimData(event)">
      
      <!-- HALAMAN 1 -->
      <div id="page1" class="form-page active">
        <div style="text-align: center;"><span class="page-indicator">Halaman 1 dari 3</span></div>
        
        <div class="input-group">
          <label>Jenis Layanan</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            </div>
            <select name="jenis_layanan" required>
              <option value="" disabled selected hidden>Pilih Jenis Layanan...</option>
              <option value="Layanan Informasi Publik">Layanan Informasi Publik</option>
              <option value="Layanan Pendaftaran">Layanan Pendaftaran</option>
              <option value="Layanan Pengaduan">Layanan Pengaduan</option>
              <option value="Layanan Administrasi Umum">Layanan Administrasi Umum</option>
            </select>
            <div class="dropdown-arrow">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>
        </div>

        <button type="button" class="btn-primary" onclick="nextPage(2)" style="margin-top: 25px;">
          Lanjut <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>

      <!-- HALAMAN 2 -->
      <div id="page2" class="form-page">
        <div style="text-align: center;"><span class="page-indicator">Halaman 2 dari 3</span></div>

        <div class="input-group">
          <label for="nama">Nama Lengkap</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <input type="text" name="nama" id="nama" placeholder="Masukkan nama..." required>
          </div>
        </div>

        <div class="input-group">
          <label>Jenis Kelamin</label>
          <div class="radio-group-horizontal">
            <label class="radio-option">
              <input type="radio" name="jenis_kelamin" value="Laki-laki" required> Laki-laki
            </label>
            <label class="radio-option">
              <input type="radio" name="jenis_kelamin" value="Perempuan"> Perempuan
            </label>
          </div>
        </div>

        <div class="input-group">
          <label for="usia">Usia (Tahun)</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </div>
            <input type="number" name="usia" id="usia" placeholder="Contoh: 25" min="15" max="100" inputmode="numeric" required>
          </div>
        </div>

        <div class="input-group">
          <label>Pendidikan Terakhir</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
            </div>
            <select name="pendidikan" required>
              <option value="" disabled selected hidden>Pilih Pendidikan...</option>
              <option value="SD/Sederajat">SD / Sederajat</option>
              <option value="SMP/Sederajat">SMP / Sederajat</option>
              <option value="SMA/Sederajat">SMA / Sederajat</option>
              <option value="D1/D2/D3">D1 / D2 / D3</option>
              <option value="S1/D4">S1 / D4</option>
              <option value="S2/S3">S2 / S3</option>
            </select>
            <div class="dropdown-arrow">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>
        </div>

        <div class="input-group">
          <label for="pekerjaan">Pekerjaan</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            </div>
            <input type="text" name="pekerjaan" id="pekerjaan" placeholder="Contoh: PNS, Swasta" required>
          </div>
        </div>

        <div class="input-group">
          <label>Penyandang Disabilitas?</label>
          <div class="radio-group-horizontal">
            <label class="radio-option">
              <input type="radio" name="is_disabilitas" value="Ya" onchange="toggleDisabilitas(true)" required> Ya
            </label>
            <label class="radio-option">
              <input type="radio" name="is_disabilitas" value="Tidak" onchange="toggleDisabilitas(false)" checked> Tidak
            </label>
          </div>
        </div>

        <div class="input-group" id="disabilitas_field" style="display: none;">
          <label for="jenis_disabilitas">Jenis Disabilitas</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            </div>
            <input type="text" name="jenis_disabilitas" id="jenis_disabilitas" placeholder="Sebutkan jenis...">
          </div>
        </div>

        <div class="btn-group" style="margin-top: 25px;">
          <button type="button" class="btn-secondary" onclick="prevPage(1)">Kembali</button>
          <button type="button" class="btn-primary" onclick="nextPage(3)">Lanjut</button>
        </div>
      </div>

      <!-- HALAMAN 3 -->
      <div id="page3" class="form-page">
        <div style="text-align: center;"><span class="page-indicator">Halaman 3 dari 3</span></div>

        <div id="questions-container"></div>

        <div class="btn-group" style="margin-top: 25px;">
          <button type="button" class="btn-secondary" onclick="prevPage(2)">Kembali</button>
          <button type="submit" id="tombol" class="btn-primary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="btn-icon"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            <span id="btn-text">Kirim</span>
          </button>
        </div>
      </div>

    </form>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="popupModal">
    <div class="modal-box">
      <div class="modal-icon" id="modalIcon"></div>
      <h3 id="modalTitle">Berhasil!</h3>
      <p id="modalMessage">Data survei Anda telah berhasil dikirim dan tersimpan di database.</p>
      <button class="modal-btn" onclick="tutupModal()">Tutup</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzmsOSGiDOsrV7xBxgyDrYWVkcEiOi5eTu9WS_g_zaI0LaZSQDbAsdO0h4409Pu2pSA/exec';

    const questions = [
      "Bagaimana pendapat Anda tentang kemudahan prosedur pelayanan di unit ini?",
      "Bagaimana kesesuaian persyaratan pelayanan dengan jenis pelayanannya?",
      "Bagaimana kejelasan dan kepastian petugas yang memberikan pelayanan?",
      "Bagaimana kedisiplinan petugas dalam memberikan pelayanan?",
      "Bagaimana tanggung jawab petugas dalam memberikan pelayanan?",
      "Bagaimana kemampuan petugas dalam memberikan pelayanan?",
      "Bagaimana kecepatan pelayanan di unit ini?",
      "Bagaimana keadilan mendapatkan pelayanan di sini?",
      "Bagaimana kesopanan dan keramahan petugas dalam memberikan pelayanan?",
      "Bagaimana kewajaran biaya untuk mendapatkan pelayanan?",
      "Bagaimana kesesuaian antara biaya yang dibayarkan dengan yang ditetapkan?",
      "Bagaimana ketepatan pelaksanaan terhadap jadwal waktu pelayanan?",
      "Bagaimana kenyamanan di lingkungan unit pelayanan?",
      "Bagaimana keamanan pelayanan di unit ini?",
      "Bagaimana penanganan pengaduan pengguna layanan?",
      "Bagaimana kualitas sarana dan prasarana pelayanan secara umum?"
    ];

    function renderQuestions() {
      const container = document.getElementById('questions-container');
      questions.forEach((q, index) => {
        const qNum = index + 1;
        const html = `
          <div class="question-card">
            <div class="question-title">${qNum}. ${q}</div>
            <div class="radio-group-horizontal">
              <label class="radio-option"><input type="radio" name="q${qNum}" value="1" required> Tidak Baik</label>
              <label class="radio-option"><input type="radio" name="q${qNum}" value="2"> Kurang Baik</label>
              <label class="radio-option"><input type="radio" name="q${qNum}" value="3"> Baik</label>
              <label class="radio-option"><input type="radio" name="q${qNum}" value="4"> Sangat Baik</label>
            </div>
          </div>
        `;
        container.innerHTML += html;
      });
    }

    renderQuestions();

    function nextPage(page) {
      if (validateCurrentPage(page - 1)) {
        document.querySelectorAll('.form-page').forEach(p => p.classList.remove('active'));
        document.getElementById(`page${page}`).classList.add('active');
        document.querySelector('.card').scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function prevPage(page) {
      document.querySelectorAll('.form-page').forEach(p => p.classList.remove('active'));
      document.getElementById(`page${page}`).classList.add('active');
      document.querySelector('.card').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleDisabilitas(show) {
      const field = document.getElementById('disabilitas_field');
      const input = document.getElementById('jenis_disabilitas');
      field.style.display = show ? 'block' : 'none';
      if (!show) input.value = '';
    }

    function validateCurrentPage(currentPage) {
      const activePageEl = document.getElementById(`page${currentPage}`);
      const inputs = activePageEl.querySelectorAll('input[required], select[required]');
      
      for (let input of inputs) {
        if (input.type === 'radio') {
          const radioGroup = activePageEl.querySelectorAll(`input[name="${input.name}"]`);
          const checked = Array.from(radioGroup).some(r => r.checked);
          if (!checked) {
            tampilkanModal('error', 'Mohon lengkapi semua pilihan yang wajib diisi.');
            return false;
          }
        } else if (!input.value.trim()) {
          tampilkanModal('error', 'Mohon isi semua bidang yang wajib diisi.');
          input.focus();
          return false;
        }
      }
      return true;
    }

    function tampilkanModal(status, message) {
      var modal = document.getElementById('popupModal');
      var icon = document.getElementById('modalIcon');
      var title = document.getElementById('modalTitle');
      var msg = document.getElementById('modalMessage');

      msg.innerText = message;

      if(status === 'success') {
        icon.className = "modal-icon success";
        icon.innerHTML = '<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
        title.innerText = "Survei Terkirim!";
      } else {
        icon.className = "modal-icon error";
        icon.innerHTML = '<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';
        title.innerText = "Perhatian";
      }
      modal.classList.add('active');
    }

    function tutupModal() {
      document.getElementById('popupModal').classList.remove('active');
    }

    function kirimData(event) {
      event.preventDefault();
      
      const tombol = document.getElementById("tombol");
      const btnText = document.getElementById("btn-text");
      const btnIcon = document.getElementById("btn-icon");
      
      tombol.disabled = true; 
      btnText.innerText = "Mengirim..."; 
      btnIcon.outerHTML = '<div class="spinner" id="btn-icon"></div>';
      
      const form = document.getElementById("formSurvey");
      const formData = new FormData(form);
      const dataObj = Object.fromEntries(formData.entries());

      fetch(SCRIPT_URL, { 
        method: 'POST', 
        body: JSON.stringify(dataObj) 
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "success") {
          tampilkanModal('success', 'Data survei Anda telah berhasil dikirim dan tersimpan di database.');
          form.reset();
          prevPage(1);
        } else {
          tampilkanModal('error', "Terjadi kesalahan: " + data.message);
        }
        resetButtonState();
      })
      .catch(error => {
        tampilkanModal('error', "Gagal mengirim data. Pastikan koneksi internet stabil.");
        resetButtonState();
      });

      function resetButtonState() {
        tombol.disabled = false; 
        btnText.innerText = "Kirim";
        document.getElementById("btn-icon").outerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="btn-icon"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>';
      }
    }
  </script>
</body>
